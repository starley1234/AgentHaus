<!doctype html><html lang="ru"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Спецификация (BOM) из PDF</title>
<style>
:root{--ink:#1f2328;--mut:#6b7280;--bg:#faf9f7;--card:#fff;--line:#e7e3dc;--accent:#5b5ff0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:3rem 1.25rem 4rem}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:1.9rem;margin:.2rem 0 .5rem}
.sub{color:var(--mut);margin:0 0 2rem}
label{font-size:.85rem;color:var(--mut);display:block;margin:0 0 .35rem}
textarea,input[type=text]{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;margin-bottom:1rem}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:.65rem 1.3rem;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin:.6rem 0}
.job .t{font-weight:600}
.job a{color:var(--accent)}
.err{color:#b91c1c;font-size:.9rem}
</style></head><body><div class="wrap">
<h1>Спецификация (BOM) из PDF</h1>
<p class="sub">Разбирает PDF со спецификацией (ведомость материалов) постранично через vision-модель в иерархический JSON + сводку.</p>
<label for="file">Файл (фото и т.п.)</label>
<input type="file" id="file" accept="image/*,.pdf,.txt" style="padding:.5rem;background:#fff">

<label for="inp">Входные данные</label>
<input type="text" id="inp" placeholder="Что сделать?">
<label for="title">Название задачи (необязательно)</label>
<input type="text" id="title" placeholder="Название результата">
<button id="go">Запустить</button>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
let poll=null;
function readFileAsBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(f)})}
async function filePayload(){const f=$("file").files[0];if(!f)return null;return{name:f.name,type:f.type||"application/octet-stream",data:await readFileAsBase64(f)}}
function chip(s){return s==='finished'?'✅ готово':s==='running'?'⏳ выполняется':s==='error'?'⚠️ ошибка':s}
function chip(s){return s==='finished'?'✅ готово':s==='running'?'⏳ выполняется':s==='error'?'⚠️ ошибка':s}
async function refresh(){const r=await(await fetch("api/jobs")).json();$("out").innerHTML=r.jobs.map(j=>
  `<div class="job"><div class="t">${esc(j.title||"Задача")}</div><div>${chip(j.status)}</div>${j.status==="finished"?`<div><a href="${j.site_url}" target="_blank">Открыть ↗</a></div>`:j.status==="error"?`<div class="err">${esc(j.error||"")}</div>`:""}</div>`).join("")}
async function start(){const go=$("go");go.disabled=true;go.textContent="Запускаю…";
 const res=await fetch("api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:$("inp").value.trim(),title:$("title").value.trim(),file: await filePayload()})});
 if(!res.ok){$("out").innerHTML=`<div class="err">Ошибка запуска</div>`;go.disabled=false;go.textContent="Запустить";return}
 const d=await res.json();refresh();poll=setInterval(async()=>{const st=await(await fetch(`api/status?id=${d.jobId}`)).json();refresh();if(st.status!=="running"&&st.status!=="stuck"){clearInterval(poll);go.disabled=false;go.textContent="Запустить"}},2000)}
$("go").onclick=start;refresh();
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script></div></body></html>
