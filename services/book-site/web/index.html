<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>КнигоГен — книга в сайт за минуты</title>
    <style>
      :root{--bg:#f6f7fb;--card:#fff;--ink:#171a23;--mut:#5f6875;--line:#e6e9f0;--accent:#5b5ff0;--accent2:#9a5ff0;--ok:#16a34a;--err:#dc2626}
      *{box-sizing:border-box}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
      .grad{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#5b5ff0,#9a5ff0);color:#fff;padding:.7rem 1.25rem}
      .grad .in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:.6rem;font-weight:600}
      .wrap{max-width:920px;margin:0 auto;padding:2rem 1.25rem 4rem}
      .hero{text-align:center;margin-bottom:2rem}
      .hero h1{font-size:2.3rem;margin:.2rem 0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
      .hero p{color:var(--mut);max-width:560px;margin:.5rem auto 0}
      .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 1px 3px rgba(20,30,60,.04)}
      label{display:block;font-size:.85rem;font-weight:600;color:var(--mut);margin:.9rem 0 .3rem}
      input,select{width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fbfcfe}
      input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
      .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
      @media(max-width:600px){.row{grid-template-columns:1fr}}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:11px;padding:.8rem 1.3rem;font-size:1rem;font-weight:600;cursor:pointer;width:100%;margin-top:1.2rem;transition:transform .06s,box-shadow .15s}
      .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(91,95,240,.35)}
      .btn:disabled{opacity:.6;cursor:not-allowed}
      .hint{font-size:.8rem;color:var(--mut);margin-top:.5rem}
      #status{margin-top:1rem;font-weight:600}
      .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.6rem}
      .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
      .err{color:var(--err);margin-top:.8rem;font-weight:600}
      .job{border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.7rem;background:#fff;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
      .job .t{flex:1;min-width:180px;font-weight:600}
      .job .m{font-size:.8rem;color:var(--mut)}
      .chip{padding:.25rem .6rem;border-radius:99px;font-size:.75rem;font-weight:700}
      .chip.running{background:#eef0ff;color:var(--accent)}
      .chip.finished{background:#e7f8ee;color:var(--ok)}
      .chip.error{background:#fdeaea;color:var(--err)}
      .job a{color:var(--accent);text-decoration:none;font-weight:600}
      .empty{color:var(--mut);text-align:center;padding:1rem}
      .flex{display:flex;gap:.5rem;flex-wrap:wrap}
    </style>
  </head>
  <body>
    <div class="grad"><div class="in">📖 КнигоГен</div></div>
    <div class="wrap">
      <div class="hero">
        <h1>Книга → готовый сайт</h1>
        <p>Задайте тему — ИИ напишет полноценную книгу и соберёт из неё красивую страницу для чтения. Никакого редактирования вручную.</p>
      </div>

      <div class="card">
        <label for="subject">Тема книги *</label>
        <input id="subject" placeholder="Например: путешествие во времени глазами подростка" />
        <div class="row">
          <div>
            <label for="genre">Жанр</label>
            <select id="genre">
              <option value="">Авто</option>
              <option>Фантастика</option>
              <option>Фэнтези</option>
              <option>Детектив</option>
              <option>Приключения</option>
              <option>Нон-фикшн</option>
              <option>Роман</option>
            </select>
          </div>
          <div>
            <label for="chapters">Глав</label>
            <select id="chapters">
              <option value="5">5</option>
              <option value="8" selected>8</option>
              <option value="10">10</option>
              <option value="12">12</option>
            </select>
          </div>
        </div>
        <button class="btn" id="go">Написать книгу</button>
        <div class="hint">Занимает несколько минут: агент пишет главы по очереди, затем собирает сайт.</div>
        <div id="status"></div>
        <div class="bar" id="bar" style="display:none"><i id="barfill"></i></div>
        <div id="error" class="err"></div>
      </div>

      <h2 style="font-size:1.15rem;margin:1.6rem 0 .7rem">Ваши книги</h2>
      <div id="jobs"></div>

      <div id="result"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const MAX_WAIT = 30 * 60 * 1000;
      let pollers = {};

      function chip(status) {
        const map = { running: "Выполняется", finished: "Готово", error: "Ошибка", idle: "Ожидание" };
        return `<span class="chip ${status}">${map[status] || status}</span>`;
      }

      async function refresh() {
        const r = await (await fetch("api/jobs")).json();
        const box = $("jobs");
        if (!r.jobs || !r.jobs.length) { box.innerHTML = '<div class="empty">Пока нет книг. Создайте первую!</div>'; return; }
        box.innerHTML = r.jobs.map((j) => `
          <div class="job" data-id="${j.id}">
            <div class="t">${esc(j.title || "Книга")}</div>
            <div class="m">${chip(j.status)} ${new Date(j.createdAt).toLocaleString()}</div>
            ${j.status === "finished"
              ? `<div class="flex"><a href="${j.site_url}" target="_blank">Открыть книгу ↗</a></div>`
              : j.status === "error"
                ? `<span class="err" style="margin:0">${esc(j.error || "ошибка")}</span>`
                : ""}
          </div>`).join("");
        r.jobs.forEach((j) => { if (j.status === "running") startPoll(j.id); });
      }

      function startPoll(id) {
        if (pollers[id]) return;
        const start = Date.now();
        pollers[id] = setInterval(async () => {
          try {
            const r = await (await fetch(`api/status?id=${id}`)).json();
            if (r.status === "finished" || r.status === "error") {
              clearInterval(pollers[id]); delete pollers[id];
              if (r.status === "finished") showResult(id);
              await refresh();
            } else if (Date.now() - start > MAX_WAIT) {
              clearInterval(pollers[id]); delete pollers[id];
            }
          } catch (e) {}
        }, 3000);
      }

      async function showResult(id) {
        const r = await (await fetch(`api/result?id=${id}`)).json();
        if (!r.ok) return;
        $("result").innerHTML = `
          <div class="card">
            <h3 style="margin:0 0 .5rem">✅ Книга готова: «${esc(r.title)}»</h3>
            <p style="color:var(--mut)">${r.chapters.length} глав. Файлы лежат в рабочей директории проекта (${esc(r.site_path || "")}).</p>
            <div class="flex">
              <a class="btn" style="width:auto;padding:.6rem 1rem" href="${r.site_url}" target="_blank">Читать онлайн ↗</a>
            </div>
          </div>`;
      }

      function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

      $("go").addEventListener("click", async () => {
        const subject = $("subject").value.trim();
        if (!subject) { $("error").textContent = "Введите тему книги"; return; }
        $("error").textContent = "";
        $("result").innerHTML = "";
        $("go").disabled = true;
        $("bar").style.display = "block";
        $("barfill").style.width = "5%";
        $("status").textContent = "Запускаю…";
        const res = await fetch("api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subject, genre: $("genre").value, chapters: Number($("chapters").value) }) });
        const data = await res.json();
        if (!data.ok) { $("error").textContent = data.error || "Ошибка"; $("go").disabled = false; return; }
        const start = Date.now();
        pollers[data.jobId] = setInterval(async () => {
          const elapsed = Math.min(0.9, (Date.now() - start) / (20 * 60 * 1000));
          $("barfill").style.width = (5 + elapsed * 95) + "%";
          $("status").textContent = "Пишу книгу… это может занять несколько минут";
          const r = await (await fetch(`api/status?id=${data.jobId}`)).json();
          if (r.status === "finished") {
            clearInterval(pollers[data.jobId]); delete pollers[data.jobId];
            $("barfill").style.width = "100%";
            $("status").textContent = "Готово!";
            await showResult(data.jobId); await refresh(); $("go").disabled = false;
          } else if (r.status === "error") {
            clearInterval(pollers[data.jobId]); delete pollers[data.jobId];
            $("status").textContent = "";
            $("error").textContent = r.error || "Ошибка выполнения"; $("go").disabled = false;
          }
        }, 3000);
      });

      refresh();
      setInterval(refresh, 8000);
    </script>
  </body>
</html>
