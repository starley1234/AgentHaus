# ═══════════════════════════════════════════════════════════════════════════════
# agent-canvas (собственная сборка с твоими правками: RU-локализация + светлая
# тема). Собирается из локального исходника, поэтому содержит все изменения.
#
# Настройки подтягиваются из файла `.env` (см. `.env.example`) в корне проекта.
# Создай свой `.env` здесь (в корне) — он уже в .gitignore, в git не попадёт.
#
# Запуск (из корня проекта):
#   docker compose up -d
# Интерфейс: http://localhost:8000/canvas
# ═══════════════════════════════════════════════════════════════════════════════

services:
  agenthaus:
    build:
      # Контекст сборки — корень репозитория (`.`), чтобы Dockerfile мог
      # скопировать и собрать локальный software-agent-sdk вместе с фронтендом.
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Значения по умолчанию берутся из config/defaults.json. Docker build
        # (в отличие от node scripts/docker-build.mjs) не читает JSON, поэтому
        # указываем их здесь. При желании переопредели через .env.
        AGENT_SERVER_IMAGE: "${AGENT_SERVER_IMAGE:-ghcr.io/openhands/agent-server:1.40.1-python}"
        AUTOMATION_VERSION: "${AUTOMATION_VERSION:-1.6.0}"
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/canvas}"
        # Рабочая директория для новых диалогов. По умолчанию /projects (смонтированный
        # хост-каталог), чтобы файлы, созданные агентом, переживали пересборку образа.
        # Внутри контейнера рабочая директория = <VITE_WORKING_DIR>/<id_hex>.
        VITE_WORKING_DIR: "${VITE_WORKING_DIR:-/projects}"
    image: agenthaus:local
    container_name: agenthaus
    restart: unless-stopped
    # Chromium в контейнере по умолчанию получает /dev/shm размером 64 МБ —
    # из-за этого рендеры и gpu-процесс падают/зависают на тяжёлых страницах.
    # 2 ГБ закрывают проблему; уменьши, если память хоста ограничена.
    shm_size: "${OH_SHM_SIZE:-2gb}"
    # Дать сервисам и браузерному сторожу время корректно завершиться.
    stop_grace_period: "${OH_STOP_GRACE_PERIOD:-45s}"
    # Защита от лавины процессов/потоков (Chromium плодит их десятками).
    pids_limit: ${OH_PIDS_LIMIT:-2048}
    ulimits:
      nofile:
        soft: ${OH_NOFILE_LIMIT:-65536}
        hard: ${OH_NOFILE_LIMIT:-65536}
    ports:
      - "${AGENT_CANVAS_PORT:-8000}:8000"
      # ВНИМАНИЕ: сервисы-прослойки (services/…) запускаются на ХОСТЕ (node
      # server.mjs) и слушают порты 8290–8300. Проброс этих портов в контейнер
      # занимает их на хосте (docker-proxy), вызывая EADDRINUSE. Поэтому проброс
      # по умолчанию отключён. Включай его ТОЛЬКО если тебе нужно, чтобы агент
      # ВНУТРИ контейнера публиковал свои веб-серверы наружу (и не запускай
      # хостовые сервисы на тех же портах одновременно):
      #   - "8290-8300:8290-8300"
    extra_hosts:
      # Чтобы из контейнера были видны сервисы на хосте (Ollama, LM Studio, vLLM).
      # Провайдера указывай как http://host.docker.internal:<port>/v1
      - "host.docker.internal:host-gateway"
    environment:
      # ── Свой LLM-провайдер (через переменные окружения, defaults на старте) ──
      # Эти значения попадают в agent-server. Чтобы провайдер отображался и
      # использовался в интерфейсе, создай LLM-профиль в Settings → LLM settings
      # (Base URL + модель + ключ) и сделай его активным. Env-переменные задают
      # значение по умолчанию для agent-server, но НЕ заполняют выпадающие
      # списки провайдеров в UI автоматически.
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_API_VERSION: "${LLM_API_VERSION:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      # ── Vision: включить обработку изображений для своих моделей ──
      # Через запятую перечисли подстроки имён моделей, которые должны
      # считаться vision-способными (если LiteLLM/реестр их не знает), напр.:
      #   OPENHANDS_VISION_MODELS: "unsloth/gemma,my-vision-model"
      OPENHANDS_VISION_MODELS: "${OPENHANDS_VISION_MODELS:-}"
      # ── Прокси для внешних LLM-провайдеров и загрузки модулей (openhands.dev, GitHub) ──
      # Единый переключатель «через прокси/напрямую»: если HTTP_PROXY задан в
      # .env — исходящий трафик (LLM, MCP, навыки/плагины, git) идёт через него;
      # если пуст — прокси отключён (прямые подключения).
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${HTTP_PROXY}}"
      ALL_PROXY: "${ALL_PROXY:-${HTTP_PROXY}}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
      # ── Навыки/расширения (OpenHands/extensions, вендоренный каталог в образе) ──
      # По умолчанию агент читает навыки из локального каталога
      # /opt/agent-canvas/extensions (зашит в образ, без сети). Если нужен другой
      # источник (например своя папка на хосте) — переопредели через .env.
      EXTENSIONS_REPO: "${EXTENSIONS_REPO:-/opt/agent-canvas/extensions}"
      # Маркетплейс-манифест внутри каталога (по умолчанию выбирается сам:
      # openhands-extensions.json, иначе default.json).
      # EXTENSIONS_MARKETPLACE: "marketplaces/openhands-extensions.json"
      # ── Производительность: ограничить параллельные агентские шаги ──
      # Каждый активный запуск может занимать LLM, браузер и отдельный поток.
      # Значение 4 — безопасный дефолт для одного self-hosted инстанса; подними
      # его только если CPU/RAM и лимиты LLM-провайдера это позволяют.
      OH_MAX_CONCURRENT_RUNS: "${OH_MAX_CONCURRENT_RUNS:-4}"

      # ── Уведомления (навык notify): email / Telegram / webhook ──
      # Контакты владельца задаются в .env один раз; агент внутри контейнера
      # наследует эти переменные и шлёт отчёты без уточняющих вопросов.
      # Подробности: docs/NOTIFICATIONS_RU.md
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # Профиль агента: единое имя/email/роль/подпись для почты и регистраций.
      # Ящик (SMTP_USER) принадлежит агенту, NOTIFY_EMAIL_TO — владельцу.
      AGENT_PROFILE_NAME: "${AGENT_PROFILE_NAME:-}"
      AGENT_PROFILE_EMAIL: "${AGENT_PROFILE_EMAIL:-}"
      AGENT_PROFILE_ROLE: "${AGENT_PROFILE_ROLE:-}"
      AGENT_PROFILE_SIGNATURE: "${AGENT_PROFILE_SIGNATURE:-}"
      NOTIFY_EMAIL_TO: "${NOTIFY_EMAIL_TO:-}"
      IMAP_HOST: "${IMAP_HOST:-}"
      IMAP_PORT: "${IMAP_PORT:-993}"
      IMAP_USER: "${IMAP_USER:-}"
      IMAP_PASSWORD: "${IMAP_PASSWORD:-}"
      NOTIFY_SAVE_SENT: "${NOTIFY_SAVE_SENT:-1}"
      IMAP_SENT_FOLDER: "${IMAP_SENT_FOLDER:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_ALLOWED_CHAT_IDS: "${TELEGRAM_ALLOWED_CHAT_IDS:-}"
      # Поведение моста при сбоях связи: экспоненциальная задержка вместо
      # спама «poll error: ETIMEDOUT» каждые 5 секунд.
      TELEGRAM_POLL_BACKOFF_MIN_MS: "${TELEGRAM_POLL_BACKOFF_MIN_MS:-3000}"
      TELEGRAM_POLL_BACKOFF_MAX_MS: "${TELEGRAM_POLL_BACKOFF_MAX_MS:-300000}"
      TELEGRAM_POLL_ERROR_REMINDER_MS: "${TELEGRAM_POLL_ERROR_REMINDER_MS:-900000}"
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
      # Рубильник создания автоматизаций (cron-задач): 0 = запретить создавать
      # новые (управление существующими остаётся доступным).
      AUTOMATION_ALLOW_CREATE: "${AUTOMATION_ALLOW_CREATE:-1}"

      # ── VNC/интерактивный браузер ──
      # Включает VNC-сервер (TigerVNC + noVNC) внутри контейнера.
      # Это позволяет использовать интерактивный просмотр браузера во вкладке
      # «Browser» — кликать, вводить текст, проходить капчу за агента.
      # Без этого работает только статичный скриншот.
      OH_ENABLE_VNC: "${OH_ENABLE_VNC:-true}"

      # ── Надёжность браузера: защита от зависшего Chromium ──
      # Два контура: внутренний сторож в agent-server
      # (openhands.tools.browser_use.process_guard) и внешний сторож контейнера
      # (docker/browser-watchdog.py), который работает даже когда agent-server
      # мёртв. Подробности и разбор инцидента: docs/BROWSER_STABILITY_RU.md
      # Внутренний сторож (убивает wedged-браузер и сбрасывает сессию):
      OH_BROWSER_GUARD: "${OH_BROWSER_GUARD:-1}"
      OH_BROWSER_GUARD_INTERVAL_SECONDS: "${OH_BROWSER_GUARD_INTERVAL_SECONDS:-10}"
      # Сколько % одного ядра и как долго может жечь процесс, пока агент НЕ
      # пользуется браузером, прежде чем мы сочтём его зависшим.
      OH_BROWSER_GUARD_CPU_PERCENT: "${OH_BROWSER_GUARD_CPU_PERCENT:-90}"
      OH_BROWSER_GUARD_CPU_SECONDS: "${OH_BROWSER_GUARD_CPU_SECONDS:-180}"
      OH_BROWSER_GUARD_IDLE_GRACE_SECONDS: "${OH_BROWSER_GUARD_IDLE_GRACE_SECONDS:-120}"
      # Абсолютные бюджеты (действуют и во время активной работы; 0 = выключить):
      OH_BROWSER_GUARD_MAX_CPU_MINUTES: "${OH_BROWSER_GUARD_MAX_CPU_MINUTES:-180}"
      OH_BROWSER_GUARD_MAX_LIFETIME_MINUTES: "${OH_BROWSER_GUARD_MAX_LIFETIME_MINUTES:-360}"
      OH_BROWSER_GUARD_MAX_RSS_MB: "${OH_BROWSER_GUARD_MAX_RSS_MB:-4096}"
      # Пауза между SIGTERM и SIGKILL и период фоновой зачистки осиротевших
      # браузеров внутри сторожа:
      OH_BROWSER_GUARD_KILL_GRACE_SECONDS: "${OH_BROWSER_GUARD_KILL_GRACE_SECONDS:-5}"
      OH_BROWSER_GUARD_SWEEP_INTERVAL_SECONDS: "${OH_BROWSER_GUARD_SWEEP_INTERVAL_SECONDS:-300}"
      # Понижать приоритет процессов браузера (nice +N), чтобы даже зависший
      # Chromium не отбирал CPU у agent-server, automation и телеграм-моста.
      OH_BROWSER_NICE_LEVEL: "${OH_BROWSER_NICE_LEVEL:-10}"
      # Добивать осиротевшие браузеры от предыдущих запусков:
      OH_BROWSER_SWEEP_ORPHANS: "${OH_BROWSER_SWEEP_ORPHANS:-1}"
      # Контейнерные флаги Chromium (--disable-gpu, лимит рендеров и т.п.):
      OH_BROWSER_HARDENED_ARGS: "${OH_BROWSER_HARDENED_ARGS:-1}"
      OH_BROWSER_RENDERER_LIMIT: "${OH_BROWSER_RENDERER_LIMIT:-4}"
      OH_BROWSER_EXTRA_ARGS: "${OH_BROWSER_EXTRA_ARGS:-}"
      # Расширения browser-use (uBlock и пр.) качаются при старте браузера БЕЗ
      # таймаута и не кэшируются в volume — в офлайне это подвешивает запуск.
      # По умолчанию выключено; включай, если нужен встроенный блокировщик.
      OH_BROWSER_DEFAULT_EXTENSIONS: "${OH_BROWSER_DEFAULT_EXTENSIONS:-0}"
      # Внешний сторож контейнера (docker/browser-watchdog.py):
      OH_BROWSER_WATCHDOG: "${OH_BROWSER_WATCHDOG:-1}"
      OH_BROWSER_WATCHDOG_INTERVAL_SECONDS: "${OH_BROWSER_WATCHDOG_INTERVAL_SECONDS:-20}"
      OH_BROWSER_WATCHDOG_CPU_PERCENT: "${OH_BROWSER_WATCHDOG_CPU_PERCENT:-90}"
      OH_BROWSER_WATCHDOG_CPU_SECONDS: "${OH_BROWSER_WATCHDOG_CPU_SECONDS:-600}"
      OH_BROWSER_WATCHDOG_MAX_CPU_MINUTES: "${OH_BROWSER_WATCHDOG_MAX_CPU_MINUTES:-240}"
      OH_BROWSER_WATCHDOG_MAX_AGE_MINUTES: "${OH_BROWSER_WATCHDOG_MAX_AGE_MINUTES:-720}"

      # ── Супервизор сервисов в entrypoint ──
      # Падающий agent-server/automation/телеграм-мост перезапускаются; после
      # N попыток подряд контейнер завершается, и Docker поднимает его заново.
      OH_SERVICE_MAX_RESTARTS: "${OH_SERVICE_MAX_RESTARTS:-5}"
      OH_SUPERVISOR_INTERVAL: "${OH_SUPERVISOR_INTERVAL:-10}"
      OH_SERVICE_STABLE_SECONDS: "${OH_SERVICE_STABLE_SECONDS:-600}"

      # ── Опциональный GitHub App (PR-only; старый git workflow не меняется) ──
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-}"
      # Лучше указывать файл, смонтированный как Docker secret; переменная
      # оставлена для совместимости с простым self-hosted запуском.
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_APP_PRIVATE_KEY_FILE: "${GITHUB_APP_PRIVATE_KEY_FILE:-}"
      # ── Безопасность: свой ключ вместо автогенерации ──
      LOCAL_BACKEND_API_KEY: "${LOCAL_BACKEND_API_KEY:-}"
      # ── При необходимости — внешний URL (если публикуешь наружу) ──
      # ВНИМАНИЕ: это ПУБЛИЧНЫЙ URL для callback'ов (webhooks). НЕ задавай его
      # по умолчанию хостовым портом: внутри контейнера агент должен ходить на
      # внутренний прокси (http://127.0.0.1:8000) — entrypoint сам подставит
      # правильный адрес, если переменная пуста.
      AUTOMATION_BASE_URL: "${AUTOMATION_BASE_URL:-}"
    volumes:
      # Персистентность: настройки, секреты, диалоги, база автоматизаций.
      - openhands_data:/home/openhands/.openhands
      # Папка с проектами, с которыми будет работать агент.
      - "${PROJECTS_PATH:-./projects}:/projects"

volumes:
  openhands_data: