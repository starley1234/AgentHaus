; Konine / Kohana — настройки PHP 8.4
; Под Koseven/Konine нужна короткая запись <? и fileinfo, но php.ini ниже — базовая.
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC
expose_php = Off
display_errors = On
log_errors = On
error_log = /tmp/php-konine-error.log
; Для Kohana: короткие теги иногда требуются старыми модулями (хотя Konine без них)
short_open_tag = On
; Opcache — ускоряет HMVC
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0
opcache.validate_timestamps=1
; Сессии — файлы в /tmp
session.save_path = "/tmp"
; Для PostgreSQL — нечего, pdo_pgsql уже включен
