; Konine pool — слушает 127.0.0.1:9000, пользователь openhands (не root)
[konine]
user = openhands
group = openhands
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Логи в /tmp чтобы не требовать root
php_admin_value[error_log] = /tmp/php-fpm-konine.log
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no
; Переменные окружения пробрасываем (для Kohana::$environment)
clear_env = no
; Таймауты
request_terminate_timeout = 120s
