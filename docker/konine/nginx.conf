# Konine nginx — слушает 8080 как дополнительный порт рядом с Canvas :8000
# DOCROOT по умолчанию /projects/konine/public . Переопредели через ENV KONINE_DOCROOT.
# Логи — в /tmp чтобы не требовать root.
user openhands;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /tmp/nginx-access.log;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # Gzip для статики Konine
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        server_name _;

        # __KONINE_ROOT__ будет заменён entrypoint-ом на $KONINE_DOCROOT или авто-детект
        root __KONINE_ROOT__;
        index index.php index.html;

        # Безопасность — скрыть скрытые файлы
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Статика — отдаём напрямую
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # HMVC фронт-контроллер Konine/Kohana:
        # всё что не файл/директория → index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP через php-fpm (127.0.0.1:9000)
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $https if_not_empty;
            # Пробросить host для генерации URL Konine::base_url()
            fastcgi_param SERVER_NAME $host;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }

        # Запретить доступ к system/application вне public
        location ~ ^/(system|application|modules)/ {
            deny all;
            return 404;
        }

        # Health для Docker
        location /nginx-health {
            access_log off;
            return 200 \"ok\\n\";
            add_header Content-Type text/plain;
        }
    }
}
