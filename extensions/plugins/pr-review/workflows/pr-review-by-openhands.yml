---
name: Ревью PR от OpenHands

on:
    # Используйте pull_request_target, чтобы разрешить PR из форков доступ к секретам при триггере мейнтейнерами
    # Безопасность: Этот workflow запускается когда:
    #   1. Новый PR открыт (не черновик), ИЛИ
    #   2. Черновой PR помечен как готовый к ревью, ИЛИ
    #   3. Мейнтейнер добавляет метку 'review-this', ИЛИ
    #   4. Мейнтейнер запрашивает openhands-agent или all-hands-bot как ревьюера
    # Добавление меток и запрос ревьюеров требует прав записи.
    # Код PR явно чекаутится для ревью, но секреты доступны только
    # потому что workflow работает в контексте базового репозитория.
    pull_request_target:
        types: [opened, ready_for_review, labeled, review_requested]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    pr-review:
        # Запускается когда выполняется одно из условий:
        #   1. Новый не-черновой PR открыт не впервые контрибьютящим, ИЛИ
        #   2. Черновой PR переведён в готовый к ревью не впервые контрибьютящим, ИЛИ
        #   3. Добавлена метка 'review-this', ИЛИ
        #   4. openhands-agent или all-hands-bot запрошен как ревьюер
        # Примечание: PR от FIRST_TIME_CONTRIBUTOR и NONE требуют ручного триггера через метку/запрос ревьюера.
        if: |
            (github.event.action == 'opened' && github.event.pull_request.draft == false && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
            (github.event.action == 'ready_for_review' && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
            github.event.label.name == 'review-this' ||
            github.event.requested_reviewer.login == 'openhands-agent' ||
            github.event.requested_reviewer.login == 'all-hands-bot'
        concurrency:
            group: pr-review-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        runs-on: ubuntu-24.04
        steps:
            - name: Запуск ревью PR
              uses: OpenHands/extensions/plugins/pr-review@main
              with:
                  llm-model: litellm_proxy/claude-sonnet-4-5-20250929
                  llm-base-url: https://llm-proxy.app.all-hands.dev
                  # [УСТАРЕЛО] review-style больше не используется; standard и roasted объединены
                  # review-style: roasted
                  use-sub-agents: 'false' # Отключено по умолчанию (issue #208: высокая стоимость / таймауты)
                  llm-api-key: ${{ secrets.LLM_API_KEY }}
                  github-token: ${{ secrets.OPENHANDS_BOT_GITHUB_PAT_PUBLIC }}
                  lmnr-api-key: ${{ secrets.LMNR_SKILLS_API_KEY }}
