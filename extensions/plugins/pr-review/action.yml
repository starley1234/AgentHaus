---
name: OpenHands Ревью PR
description: Автоматизированное ревью PR с использованием агента OpenHands
author: OpenHands

branding:
    icon: code
    color: blue

inputs:
    agent-kind:
        description: >
            Бэкенд агента ревью. Используйте 'openhands' для стандартного
            SDK-агента OpenHands, или 'acp' для запуска ACP-совместимого агент-сервера.
        required: false
        default: openhands
    llm-model:
        description: >
            LLM-модель для ревью. В режиме ACP передаётся ACP-серверу, когда поддерживается.
            Может быть списком через запятую для A/B тестирования — одна модель будет случайно выбрана на ревью.
            Пример: 'model-a' или 'model-a,model-b,model-c'
        required: false
        default: anthropic/claude-sonnet-4-5-20250929
    acp-command:
        description: >
            Команда для запуска ACP-сервера, когда agent-kind = 'acp'.
            Команда должна быть доступна в окружении раннера или запускаться через пакетный менеджер.
            Значение shell-split'ится перед выполнением.
            Примеры: 'npx -y @zed-industries/codex-acp@0.12.0',
            'codex-acp', 'claude-agent-acp' или 'npx -y @agentclientprotocol/claude-agent-acp'.
        required: false
        default: ''
    acp-prompt-timeout:
        description: Таймаут в секундах на один ход промпта ACP.
        required: false
        default: '1800'
    llm-base-url:
        description: Базовый URL LLM (опционально, для кастомных эндпоинтов LLM)
        required: false
        default: ''
    review-style:
        description: "[УСТАРЕЛО] Ранее выбирал между стилями ревью 'standard' и 'roasted'. Они объединены в один навык code-review. Вход сохранён для обратной совместимости, но больше не меняет поведение. Будет удалён в будущей версии."
        required: false
        default: roasted
    require-evidence:
        description: "Когда true, требовать от ревьюера проверки описания PR на наличие раздела Evidence, доказывающего работоспособность кода сквозным образом (скриншоты/видео для изменений фронтенда; команды и вывод рантайма для бэкенда, CLI или скриптов; ссылка на беседу, когда сгенерировано агентом). Один вывод тестов не считается."
        required: false
        default: 'false'
    use-sub-agents:
        description: >
            Включить делегирование под-агентам для ревью на уровне файлов.
            Когда true, агент получает TaskToolSet и решает в рантайме, делегировать ли, на основе размера и сложности диффа.
            Отключено по умолчанию из-за высоких затрат на токены и потенциальных таймаутов (см. issue #208). Установите 'true' для включения.
        required: false
        default: 'false'
    load-public-skills:
        description: >
            Загружать публичный репозиторий навыков в контекст агента ревью.
            Отключите, чтобы ограничить промпты ревью PR только навыками проекта и навыками плагина pr-review.
        required: false
        default: 'true'
    collect-feedback:
        description: >
            Просить мейнтейнеров оценить автоматизированное ревью реакциями thumbs up/down, добавляя короткий футер к основному телу ревью.
        required: false
        default: 'true'
    extensions-repo:
        description: Репозиторий GitHub для расширений (owner/repo)
        required: false
        default: OpenHands/extensions
    extensions-version:
        description: Git ref для использования расширений (тег, ветка или SHA коммита, например, v1.0.0, main или abc1234)
        required: false
        default: main
    openhands-sdk-package:
        description: >
            Спецификация пакета, передаваемая в uv для openhands-sdk. Оставьте дефолт для нормального использования,
            или переопределите, чтобы зафиксировать конкретную сборку SDK для тестирования или контроля раскатки.
        required: false
        default: openhands-sdk
    llm-api-key:
        description: >
            API-ключ LLM. Требуется, когда agent-kind = 'openhands'.
            Игнорируется в режиме ACP, потому что ACP-сервер владеет аутентификацией.
        required: false
    github-token:
        description: GitHub токен для доступа к API (обязательно)
        required: true
    lmnr-api-key:
        description: API-ключ Laminar для наблюдаемости (опционально)
        required: false
        default: ''
    enable-uv-cache:
        description: >
            Включить кэш GitHub Actions для setup-uv для Python-зависимостей.
            По умолчанию 'false' для безопасности: общие кэши могут стать pivot'ом в более привилегированные workflow
            (prompt-injected ревьюер мог бы записать вредоносный wheel в кэш; последующий более привилегированный workflow попадает в отравленный кэш).
            Включайте только когда контролируете окружение раннера (например, self-hosted, single-tenant) и принимаете компромисс.
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Checkout репозитория расширений
          uses: actions/checkout@v4
          with:
              repository: ${{ inputs.extensions-repo }}
              ref: ${{ inputs.extensions-version }}
              path: extensions

        - name: Checkout репозитория PR
          uses: actions/checkout@v4
          with:
              repository: ${{ github.event.pull_request.head.repo.full_name }}
              ref: ${{ github.event.pull_request.head.ref }}
              fetch-depth: 0
              persist-credentials: false
              path: pr-repo
              submodules: recursive

        - name: Настройка Python
          uses: actions/setup-python@v5
          with:
              python-version: '3.12'

        # Безопасность: кэширование отключено по умолчанию. Prompt injection может принудить
        # ревьюера к выполнению команд, и общие кэши могут стать pivot'ом в более привилегированные workflow.
        # Включайте через `enable-uv-cache` только когда раннер single-tenant / self-hosted.
        - name: Установка uv
          uses: astral-sh/setup-uv@v6
          with:
              enable-cache: ${{ inputs.enable-uv-cache }}

        - name: Установка GitHub CLI
          shell: bash
          run: |
              # `gh` предустановлен на всех GitHub-hosted Ubuntu раннерах, поэтому
              # apt-путь запускается только на self-hosted раннерах без него. Это
              # избегает ~10s `apt-get update` на каждом ревью на hosted раннерах,
              # а также избегает ложных сбоев, когда apt-зеркало нестабильно.
              if command -v gh >/dev/null 2>&1; then
                  echo "gh уже установлен: $(gh --version | head -n1)"
              else
                  echo "gh не найден, устанавливаю через apt..."
                  sudo apt-get update
                  sudo apt-get install -y gh
              fi

        - name: Проверка требуемой конфигурации и выбор модели
          id: select-model
          shell: bash
          env:
              AGENT_KIND: ${{ inputs.agent-kind }}
              ACP_COMMAND: ${{ inputs.acp-command }}
              LLM_API_KEY: ${{ inputs.llm-api-key }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              LLM_MODEL_INPUT: ${{ inputs.llm-model }}
              LLM_BASE_URL: ${{ inputs.llm-base-url }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              PR_TITLE: ${{ github.event.pull_request.title }}
              REPOSITORY: ${{ github.repository }}
              EXTENSIONS_VERSION: ${{ inputs.extensions-version }}
          run: |
              if [ "$AGENT_KIND" != "openhands" ] && [ "$AGENT_KIND" != "acp" ]; then
                echo "Ошибка: agent-kind должен быть 'openhands' или 'acp'."
                exit 1
              fi

              if [ "$AGENT_KIND" = "openhands" ] && [ -z "$LLM_API_KEY" ]; then
                echo "Ошибка: llm-api-key обязателен, когда agent-kind = 'openhands'."
                exit 1
              fi

              if [ "$AGENT_KIND" = "acp" ] && [ -z "$ACP_COMMAND" ]; then
                echo "Ошибка: acp-command обязателен, когда agent-kind = 'acp'."
                exit 1
              fi

              if [ -z "$GITHUB_TOKEN" ]; then
                echo "Ошибка: github-token обязателен."
                exit 1
              fi

              # Выбрать одну модель случайно из списка через запятую
              MODELS_LIST="$LLM_MODEL_INPUT"
              IFS=',' read -ra MODELS <<< "$MODELS_LIST"
              SELECTED_MODEL="${MODELS[$RANDOM % ${#MODELS[@]}]}"
              printf 'selected_model=%s\n' "$SELECTED_MODEL" >> "$GITHUB_OUTPUT"

              printf 'Номер PR: %s\n' "$PR_NUMBER"
              printf 'Заголовок PR: %s\n' "$PR_TITLE"
              printf 'Репозиторий: %s\n' "$REPOSITORY"
              printf 'Версия расширений: %s\n' "$EXTENSIONS_VERSION"
              printf 'Тип агента: %s\n' "$AGENT_KIND"
              printf 'Доступные модели: %s\n' "$MODELS_LIST"
              printf 'Выбранная LLM-модель: %s\n' "$SELECTED_MODEL"
              if [ "$AGENT_KIND" = "acp" ]; then
                printf 'Команда ACP: %s\n' "$ACP_COMMAND"
              fi
              if [ -n "$LLM_BASE_URL" ]; then
                printf 'Базовый URL LLM: %s\n' "$LLM_BASE_URL"
              fi

        - name: Предварительная проверка прав на ревью (smoke test)
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              REPOSITORY: ${{ github.repository }}
          run: |
              if ! REVIEW_ID="$(
                gh api \
                  -X POST \
                  "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                  -f body='Предварительная проверка прав на ревью. Это pending ревью будет сразу удалено.' \
                  --jq '.id'
              )"; then
                echo "Не удалось создать pending ревью при предварительной проверке"
                echo "У GITHUB_TOKEN нет права 'pull_requests: write'."
                echo "Добавьте 'permissions: { pull-requests: write }' в job вашего workflow."
                exit 1
              fi

              if [ -z "$REVIEW_ID" ]; then
                echo "Предварительная проверка вернула пустой review id"
                exit 1
              fi

              if ! gh api \
                -X DELETE \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}"; then
                echo "Предупреждение: Не удалось удалить тестовое ревью (ID: ${REVIEW_ID}). Это косметика и не повлияет на workflow."
              fi

        - name: Запуск ревью PR
          shell: bash
          env:
              UV_PYTHON: '3.12'
              OPENHANDS_SDK_PACKAGE: ${{ inputs.openhands-sdk-package }}
              AGENT_KIND: ${{ inputs.agent-kind }}
              ACP_COMMAND: ${{ inputs.acp-command }}
              ACP_PROMPT_TIMEOUT: ${{ inputs.acp-prompt-timeout }}
              LLM_MODEL: ${{ steps.select-model.outputs.selected_model }}
              LLM_BASE_URL: ${{ inputs.llm-base-url }}
              REVIEW_STYLE: ${{ inputs.review-style }}
              REQUIRE_EVIDENCE: ${{ inputs.require-evidence }}
              COLLECT_FEEDBACK: ${{ inputs.collect-feedback }}
              REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              USE_SUB_AGENTS: ${{ inputs.use-sub-agents }}
              LOAD_PUBLIC_SKILLS: ${{ inputs.load-public-skills }}
              LLM_API_KEY: ${{ inputs.llm-api-key }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              LMNR_PROJECT_API_KEY: ${{ inputs.lmnr-api-key }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              PR_TITLE: ${{ github.event.pull_request.title }}
              PR_BODY: ${{ github.event.pull_request.body }}
              PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
              PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
              REPO_NAME: ${{ github.repository }}
          run: |
              cd pr-repo
              uv run --no-project --with "$OPENHANDS_SDK_PACKAGE" --with openhands-tools --with lmnr \
                python ../extensions/plugins/pr-review/scripts/agent_script.py

        - name: Загрузка логов как артефакта
          uses: actions/upload-artifact@v4
          if: always()
          with:
              name: openhands-pr-review-logs
              path: |
                  *.log
                  output/
              retention-days: 7

        - name: Загрузка информации о трейсе Laminar для оценки
          uses: actions/upload-artifact@v4
          if: success()
          with:
              name: pr-review-trace-${{ github.event.pull_request.number }}
              path: pr-repo/laminar_trace_info.json
              retention-days: 30
              if-no-files-found: ignore
