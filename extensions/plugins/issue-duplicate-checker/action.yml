---
name: OpenHands Проверка дубликатов Issue
description: Поиск, комментирование и автозакрытие дублирующихся GitHub issue с помощью OpenHands Cloud
author: OpenHands

branding:
    icon: search
    color: orange

inputs:
    mode:
        description: "Какую операцию выполнить: issue-check, auto-close или remove-label."
        required: true
    repository:
        description: Репозиторий в формате owner/repo. Требуется для режимов issue-check и auto-close.
        required: false
        default: ''
    issue-number:
        description: Номер issue для проверки в режиме issue-check.
        required: false
        default: ''
    close-after-days:
        description: Сколько дней ждать перед автозакрытием кандидатов-дубликатов.
        required: false
        default: '3'
    dry-run:
        description: Предпросмотр действий автозакрытия без изменения issue. Используется только в режиме auto-close.
        required: false
        default: 'false'
    openhands-api-key:
        description: API-ключ OpenHands Cloud. Требуется для режима issue-check.
        required: false
        default: ''
    github-token:
        description: GitHub токен с доступом issues:write.
        required: true
    openhands-base-url:
        description: Базовый URL OpenHands Cloud.
        required: false
        default: https://app.all-hands.dev
    github-api-base-url:
        description: Базовый URL GitHub API.
        required: false
        default: https://api.github.com
    github-base-url:
        description: Базовый веб-URL GitHub, используемый в примерах промпта проверки дубликатов.
        required: false
        default: https://github.com
    python-version:
        description: Версия Python для встроенных вспомогательных скриптов.
        required: false
        default: '3.x'
    poll-interval-seconds:
        description: Интервал опроса при ожидании бесед OpenHands. Используется только в режиме issue-check.
        required: false
        default: '5'
    max-wait-seconds:
        description: Максимальное количество секунд ожидания каждой фазы опроса OpenHands. Используется только в режиме issue-check.
        required: false
        default: '900'

outputs:
    should_comment:
        description: Нужно ли публиковать уведомление о дубликате/пересечении.
        value: ${{ steps.parsed_result.outputs.should_comment }}
    is_duplicate:
        description: Является ли анализируемый issue точным или почти точным дубликатом.
        value: ${{ steps.parsed_result.outputs.is_duplicate }}
    auto_close_candidate:
        description: Следует ли пометить анализируемый issue для отложенного автозакрытия как дубликат.
        value: ${{ steps.parsed_result.outputs.auto_close_candidate }}
    confidence:
        description: Уверенность проверки дубликатов.
        value: ${{ steps.parsed_result.outputs.confidence }}
    classification:
        description: duplicate, overlapping-scope, related-but-distinct или no-match.
        value: ${{ steps.parsed_result.outputs.classification }}
    canonical_issue_number:
        description: Номер канонического issue, если он был определён.
        value: ${{ steps.parsed_result.outputs.canonical_issue_number }}
    conversation_url:
        description: URL беседы OpenHands, использованной для проверки дубликатов.
        value: ${{ steps.parsed_result.outputs.conversation_url }}
    app_conversation_id:
        description: ID беседы приложения OpenHands, использованный для проверки дубликатов.
        value: ${{ steps.parsed_result.outputs.app_conversation_id }}
    summary:
        description: Краткое резюме проверки дубликатов.
        value: ${{ steps.parsed_result.outputs.summary }}
    candidate_issues_json:
        description: JSON-массив кандидатов в дубликаты.
        value: ${{ steps.parsed_result.outputs.candidate_issues_json }}

runs:
    using: composite
    steps:
        - name: Проверка режима
          shell: bash
          env:
              MODE: ${{ inputs.mode }}
              REPOSITORY: ${{ inputs.repository }}
          run: |
              case "$MODE" in
                issue-check|auto-close) 
                  if [ -z "$REPOSITORY" ]; then
                    echo "Ошибка: repository обязателен для режима $MODE" >&2
                    exit 1
                  fi
                  ;;
                remove-label) ;;
                *)
                  echo "Ошибка: mode должен быть одним из: issue-check, auto-close, remove-label" >&2
                  exit 1
                  ;;
              esac

        - name: Настройка Python
          if: inputs.mode == 'issue-check' || inputs.mode == 'auto-close'
          uses: actions/setup-python@v6
          with:
              python-version: ${{ inputs.python-version }}

        - name: Проверка входных данных проверки дубликатов
          if: inputs.mode == 'issue-check'
          shell: bash
          env:
              OPENHANDS_API_KEY: ${{ inputs.openhands-api-key }}
              ISSUE_NUMBER: ${{ inputs.issue-number }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
          run: |
              if [ -z "$OPENHANDS_API_KEY" ]; then
                echo "Ошибка: openhands-api-key обязателен для режима issue-check" >&2
                exit 1
              fi
              if [ -z "$ISSUE_NUMBER" ]; then
                echo "Ошибка: issue-number обязателен для режима issue-check" >&2
                exit 1
              fi
              if [ -z "$GITHUB_TOKEN" ]; then
                echo "Ошибка: github-token обязателен" >&2
                exit 1
              fi

        - name: Запуск беседы проверки дубликатов OpenHands
          if: inputs.mode == 'issue-check'
          id: run_check
          shell: bash
          env:
              OPENHANDS_API_KEY: ${{ inputs.openhands-api-key }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              ISSUE_NUMBER: ${{ inputs.issue-number }}
              OUTPUT_PATH: ${{ runner.temp }}/issue-duplicate-check-result.json
              REPOSITORY: ${{ inputs.repository }}
              OPENHANDS_BASE_URL: ${{ inputs.openhands-base-url }}
              GITHUB_API_BASE_URL: ${{ inputs.github-api-base-url }}
              GITHUB_BASE_URL: ${{ inputs.github-base-url }}
              POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
              MAX_WAIT_SECONDS: ${{ inputs.max-wait-seconds }}
              DUPLICATE_CHECK_SCRIPT: ${{ github.action_path }}/scripts/issue_duplicate_check_openhands.py
          run: |
              python "$DUPLICATE_CHECK_SCRIPT" \
                --repository "$REPOSITORY" \
                --issue-number "$ISSUE_NUMBER" \
                --poll-interval-seconds "$POLL_INTERVAL_SECONDS" \
                --max-wait-seconds "$MAX_WAIT_SECONDS" \
                --output "$OUTPUT_PATH"
              test -f "$OUTPUT_PATH" || {
                echo "Ошибка: выходной файл не создан" >&2
                exit 1
              }
              echo "result_path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

        - name: Разбор результата проверки дубликатов
          if: inputs.mode == 'issue-check'
          id: parsed_result
          shell: bash
          env:
              RESULT_PATH: ${{ steps.run_check.outputs.result_path }}
          run: |
              python - <<'PY'
              import json
              import os
              import sys
              from pathlib import Path

              try:
                  result = json.loads(Path(os.environ['RESULT_PATH']).read_text())
              except (FileNotFoundError, json.JSONDecodeError) as exc:
                  print(
                      f"Ошибка: Не удалось прочитать результат проверки дубликатов: {exc}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1) from exc
              output_path = Path(os.environ['GITHUB_OUTPUT'])
              summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])

              def write_multiline(name: str, value: str) -> None:
                  delimiter = f"EOF_{os.urandom(8).hex()}"
                  with output_path.open('a', encoding='utf-8') as fh:
                      fh.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")

              canonical_issue_number = result.get('canonical_issue_number')
              with output_path.open('a', encoding='utf-8') as fh:
                  fh.write(f"should_comment={'true' if result.get('should_comment') else 'false'}\n")
                  fh.write(f"is_duplicate={'true' if result.get('is_duplicate') else 'false'}\n")
                  fh.write(
                      f"auto_close_candidate={'true' if result.get('auto_close_candidate') else 'false'}\n"
                  )
                  fh.write(f"confidence={result.get('confidence', '')}\n")
                  fh.write(f"classification={result.get('classification', '')}\n")
                  fh.write(
                      f"canonical_issue_number={canonical_issue_number if canonical_issue_number is not None else ''}\n"
                  )
                  fh.write(f"conversation_url={result.get('conversation_url', '')}\n")
                  fh.write(f"app_conversation_id={result.get('app_conversation_id', '')}\n")

              write_multiline('summary', str(result.get('summary', '')).strip())
              write_multiline(
                  'candidate_issues_json',
                  json.dumps(result.get('candidate_issues', []), ensure_ascii=False),
              )

              candidate_lines = []
              for candidate in result.get('candidate_issues', []):
                  candidate_lines.append(
                      f"- #{candidate.get('number')}: {candidate.get('title')} ({candidate.get('url')}) — {candidate.get('similarity_reason', '')}"
                  )

              summary_text = (
                  "\n".join(
                      [
                          "## Результат проверки дубликатов",
                          "",
                          f"- Репозиторий: {result.get('repository')}",
                          f"- Issue: #{result.get('issue_number')}",
                          f"- Нужно комментировать: {result.get('should_comment')}",
                          f"- Точный дубликат: {result.get('is_duplicate')}",
                          f"- Кандидат на автозакрытие: {result.get('auto_close_candidate')}",
                          f"- Классификация: {result.get('classification')}",
                          f"- Уверенность: {result.get('confidence')}",
                          f"- Канонический issue: {canonical_issue_number}",
                          f"- Беседа: {result.get('conversation_url')}",
                          "",
                          "### Резюме",
                          result.get('summary', ''),
                          "",
                          "### Кандидаты",
                          *(candidate_lines or ["- Нет"]),
                      ]
                  )
                  + "\n"
              )
              with summary_path.open('a', encoding='utf-8') as fh:
                  fh.write(summary_text)
              PY

        - name: Публикация уведомления о дубликате/пересечении
          if: inputs.mode == 'issue-check' && steps.parsed_result.outputs.should_comment == 'true'
          uses: actions/github-script@v9
          env:
              ACTION_SCRIPT: ${{ github.action_path }}/scripts/post_duplicate_notice.cjs
              ISSUE_NUMBER: ${{ inputs.issue-number }}
              SUMMARY: ${{ steps.parsed_result.outputs.summary }}
              CANDIDATE_ISSUES_JSON: ${{ steps.parsed_result.outputs.candidate_issues_json }}
              CLASSIFICATION: ${{ steps.parsed_result.outputs.classification }}
              AUTO_CLOSE_CANDIDATE: ${{ steps.parsed_result.outputs.auto_close_candidate }}
              CANONICAL_ISSUE_NUMBER: ${{ steps.parsed_result.outputs.canonical_issue_number }}
              CLOSE_AFTER_DAYS: ${{ inputs.close-after-days }}
          with:
              github-token: ${{ inputs.github-token }}
              script: |
                  const run = require(process.env.ACTION_SCRIPT);
                  await run({ github, context, core });

        - name: Проверка входных данных автозакрытия
          if: inputs.mode == 'auto-close'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
          run: |
              if [ -z "$GITHUB_TOKEN" ]; then
                echo "Ошибка: github-token обязателен" >&2
                exit 1
              fi

        - name: Автозакрытие старых кандидатов-дубликатов
          if: inputs.mode == 'auto-close'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              CLOSE_AFTER_DAYS: ${{ inputs.close-after-days }}
              REPOSITORY: ${{ inputs.repository }}
              GITHUB_API_BASE_URL: ${{ inputs.github-api-base-url }}
              DRY_RUN: ${{ inputs.dry-run }}
              AUTO_CLOSE_SCRIPT: ${{ github.action_path }}/scripts/auto_close_duplicate_issues.py
          run: |
              dry_run_arg=()
              if [ "$DRY_RUN" = "true" ]; then
                dry_run_arg=(--dry-run)
              fi
              python "$AUTO_CLOSE_SCRIPT" \
                --repository "$REPOSITORY" \
                --close-after-days "$CLOSE_AFTER_DAYS" \
                "${dry_run_arg[@]}" | tee "$RUNNER_TEMP/auto-close-summary.json"
              status=${PIPESTATUS[0]}
              if [ "$status" -ne 0 ]; then
                echo "::error::Скрипт автозакрытия завершился с кодом $status"
                exit "$status"
              fi

        - name: Сводка автозакрытия
          if: inputs.mode == 'auto-close'
          shell: bash
          run: |
              python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
              import json
              import os
              from pathlib import Path

              data = json.loads(Path(os.environ['RUNNER_TEMP'], 'auto-close-summary.json').read_text())
              print('## Автозакрытие кандидатов-дубликатов')
              print()
              results = data.get('results') if isinstance(data, dict) else []
              if not results:
                  print('- Нет подходящих кандидатов-дубликатов.')
              for result in results:
                  issue = result.get('issue_number', '?')
                  action = result.get('action', 'unknown')
                  reason = result.get('reason')
                  canonical = result.get('canonical_issue_number')
                  details = []
                  if canonical is not None:
                      details.append(f'канонический #{canonical}')
                  if reason:
                      details.append(str(reason))
                  suffix = f" ({'; '.join(details)})" if details else ''
                  print(f'- #{issue}: {action}{suffix}')
              PY

        - name: Удаление метки duplicate-candidate
          if: inputs.mode == 'remove-label'
          uses: actions/github-script@v9
          env:
              ACTION_SCRIPT: ${{ github.action_path }}/scripts/remove_duplicate_candidate_label.cjs
          with:
              github-token: ${{ inputs.github-token }}
              script: |
                  const run = require(process.env.ACTION_SCRIPT);
                  await run({ github, context, core });
