---
name: OpenHands Генератор Release Notes
description: Генерация release notes, созданных агентом, из истории git и контекста PR
author: OpenHands

branding:
    icon: file-text
    color: green

inputs:
    tag:
        description: Тег релиза, для которого генерировать заметки
        required: true
    previous-tag:
        description: Переопределить автоматическое определение предыдущего тега релиза
        required: false
        default: ''
    include-internal:
        description: Включать внутренние/инфраструктурные изменения в заметки о релизе
        required: false
        default: 'false'
    output-format:
        description: "Формат вывода: 'release' (релиз GitHub) или 'changelog' (CHANGELOG.md)"
        required: false
        default: release
    llm-model:
        description: LLM-модель для генерации release notes на основе агента
        required: false
        default: anthropic/claude-sonnet-4-5-20250929
    llm-base-url:
        description: Базовый URL LLM (опционально, для кастомных эндпоинтов LLM)
        required: false
        default: ''
    llm-api-key:
        description: API-ключ LLM (обязательно)
        required: true
    github-token:
        description: GitHub токен для доступа к API (обязательно)
        required: true

outputs:
    release-notes:
        description: Сгенерированные заметки о релизе в формате markdown
        value: ${{ steps.generate.outputs.release_notes }}
    previous-tag:
        description: Обнаруженный или предоставленный предыдущий тег релиза
        value: ${{ steps.generate.outputs.previous_tag }}
    commit-count:
        description: Количество коммитов, включённых в релиз
        value: ${{ steps.generate.outputs.commit_count }}
    contributor-count:
        description: Количество уникальных контрибьюторов
        value: ${{ steps.generate.outputs.contributor_count }}
    new-contributor-count:
        description: Количество впервые контрибьютящих
        value: ${{ steps.generate.outputs.new_contributor_count }}

runs:
    using: composite
    steps:
        - name: Checkout репозитория расширений
          uses: actions/checkout@v4
          with:
              repository: OpenHands/extensions
              ref: main
              path: extensions
              sparse-checkout: plugins/release-notes

        - name: Настройка Python
          uses: actions/setup-python@v5
          with:
              python-version: '3.12'

        - name: Установка uv
          uses: astral-sh/setup-uv@v6
          with:
              enable-cache: true

        - name: Генерация release notes
          id: generate
          shell: bash
          env:
              LLM_MODEL: ${{ inputs.llm-model }}
              LLM_BASE_URL: ${{ inputs.llm-base-url }}
              LLM_API_KEY: ${{ inputs.llm-api-key }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              TAG: ${{ inputs.tag }}
              PREVIOUS_TAG: ${{ inputs.previous-tag }}
              INCLUDE_INTERNAL: ${{ inputs.include-internal }}
              OUTPUT_FORMAT: ${{ inputs.output-format }}
              REPO_NAME: ${{ github.repository }}
          run: |
              uv run --with openhands-sdk --with openhands-tools \
                python extensions/plugins/release-notes/scripts/agent_script.py

        - name: Валидация атрибуции PR и авторов
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              TAG: ${{ inputs.tag }}
              PREVIOUS_TAG: ${{ inputs.previous-tag }}
              INCLUDE_INTERNAL: ${{ inputs.include-internal }}
              REPO_NAME: ${{ github.repository }}
          run: |
              python extensions/plugins/release-notes/scripts/validate_release_notes.py

        - name: Обновление релиза GitHub (если формат release)
          if: inputs.output-format == 'release'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              INPUTS_TAG: ${{ inputs.tag }}
          run: |
              if [ -f release_notes.md ]; then
                echo "Обновление заметок о релизе для тега $INPUTS_TAG"
                gh release edit "$INPUTS_TAG" --notes-file release_notes.md || \
                  echo "Примечание: Не удалось обновить релиз. Релиз может ещё не существовать."
              fi
