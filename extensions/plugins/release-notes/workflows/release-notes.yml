---
name: Генерация Release Notes

on:
    # Триггер на тегах релиза, соответствующих паттерну semver
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+*'

    # Разрешить ручной триггер с вводом тега
    workflow_dispatch:
        inputs:
            tag:
                description: 'Тег релиза, для которого генерировать заметки'
                required: true
                type: string
            previous-tag:
                description: 'Переопределить автоматическое определение предыдущего тега релиза'
                required: false
                type: string
            include-internal:
                description: 'Включать внутренние/инфраструктурные изменения'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    generate-release-notes:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout репозитория
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Полная история для сравнения тегов

            - name: Определение тега
              id: get-tag
              env:
                GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
                GITHUB_REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "tag=$GITHUB_EVENT_INPUTS_TAG" >> $GITHUB_OUTPUT
                  else
                    echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
                  fi

            - name: Генерация Release Notes
              id: release-notes
              uses: OpenHands/extensions/plugins/release-notes@main
              with:
                  tag: ${{ steps.get-tag.outputs.tag }}
                  previous-tag: ${{ github.event.inputs.previous-tag || '' }}
                  include-internal: ${{ github.event.inputs.include-internal || 'false' }}
                  output-format: release
                  llm-api-key: ${{ secrets.LLM_API_KEY }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Показать сгенерированные заметки
              env:
                TAG: ${{ steps.get-tag.outputs.tag }}
                PREVIOUS_TAG: ${{ steps.release-notes.outputs.previous-tag }}
              run: |
                  echo "## Заметки о релизе для $TAG"
                  echo ""
                  echo "Предыдущий тег: $PREVIOUS_TAG"
                  echo "Коммитов: ${{ steps.release-notes.outputs.commit-count }}"
                  echo "Контрибьюторов: ${{ steps.release-notes.outputs.contributor-count }}"
                  echo "Новых контрибьюторов: ${{ steps.release-notes.outputs.new-contributor-count }}"
                  echo ""
                  echo "---"
                  cat release_notes.md

            - name: Загрузка артефакта заметок о релизе
              uses: actions/upload-artifact@v4
              with:
                  name: release-notes-${{ steps.get-tag.outputs.tag }}
                  path: release_notes.md
                  retention-days: 30
