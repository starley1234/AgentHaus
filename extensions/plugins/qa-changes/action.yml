---
name: OpenHands QA изменений
description: Автоматизированная QA-валидация изменений PR с использованием агента OpenHands
author: OpenHands

branding:
  icon: check-circle
  color: green

inputs:
  llm-model:
    description: LLM-модель для QA-валидации.
    required: false
    default: anthropic/claude-sonnet-4-5-20250929
  llm-base-url:
    description: Базовый URL LLM (опционально, для кастомных эндпоинтов LLM)
    required: false
    default: ''
  extensions-repo:
    description: GitHub репозиторий для расширений (owner/repo)
    required: false
    default: OpenHands/extensions
  extensions-version:
    description: Git ref для использования расширений (тег, ветка или SHA коммита)
    required: false
    default: main
  max-budget:
    description: Максимальная стоимость LLM в долларах. Агент останавливается при превышении бюджета.
    required: false
    default: '10.0'
  timeout-minutes:
    description: Максимальное время wall-clock в минутах для QA-задачи.
    required: false
    default: '30'
  max-iterations:
    description: Максимальное количество итераций агента (каждая итерация — один вызов LLM + действие).
    required: false
    default: '500'
  llm-api-key:
    description: API-ключ LLM (обязательно)
    required: true
  github-token:
    description: GitHub токен для доступа к API (обязательно)
    required: true
  lmnr-api-key:
    description: API-ключ Laminar для наблюдаемости (опционально)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Предварительная проверка форка/секретов
      id: preflight
      shell: bash
      env:
        IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
      run: |
        if [ "$IS_FORK_PR" = "true" ] && [ -z "$LLM_API_KEY" ]; then
          echo "::notice title=Пропуск QA Changes для форк-PR::Этот workflow работает в контексте pull_request, поэтому форк-PR не получают секреты репозитория, такие как LLM_API_KEY. Пропускаем автоматизированный QA вместо падения. Мейнтейнер может запустить QA локально или через отдельный доверенный workflow."
          {
            echo "## QA Changes пропущен"
            echo
            echo "Этот PR пришёл из форка, и pull_request workflow не получают секреты репозитория, такие как LLM_API_KEY."
            echo "Пропускаем автоматизированный QA вместо падения."
            echo
            echo "Мейнтейнер может запустить QA локально или через отдельный доверенный workflow при необходимости."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Checkout репозитория расширений
      if: steps.preflight.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.extensions-repo }}
        ref: ${{ inputs.extensions-version }}
        path: extensions

    - name: Checkout репозитория PR
      if: steps.preflight.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        persist-credentials: false
        path: pr-repo
        submodules: recursive

    - name: Настройка Python
      if: steps.preflight.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Установка uv
      if: steps.preflight.outputs.skip != 'true'
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false

    - name: Установка системных зависимостей
      if: steps.preflight.outputs.skip != 'true'
      shell: bash
      run: |
        sudo apt-get update
        # gh: GitHub CLI для публикации QA-отчётов
        # tmux: требуется для рантайма агента OpenHands
        sudo apt-get install -y gh tmux

    - name: Проверка требуемой конфигурации
      if: steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_EVENT_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        INPUTS_LLM_MODEL: ${{ inputs.llm-model }}
      run: |
        if [ -z "$LLM_API_KEY" ]; then
          echo "Ошибка: llm-api-key обязателен."
          exit 1
        fi
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "Ошибка: github-token обязателен."
          exit 1
        fi

        echo "Номер PR: ${{ github.event.pull_request.number }}"
        echo "Заголовок PR: $GITHUB_EVENT_PULL_REQUEST_TITLE"
        echo "Репозиторий: ${{ github.repository }}"
        echo "LLM-модель: $INPUTS_LLM_MODEL"

    - name: Запуск QA-валидации
      if: steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LMNR_PROJECT_API_KEY: ${{ inputs.lmnr-api-key }}
        MAX_BUDGET: ${{ inputs.max-budget }}
        MAX_ITERATIONS: ${{ inputs.max-iterations }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        REPO_NAME: ${{ github.repository }}
      run: |
        cd pr-repo
        # timeout-minutes не поддерживается на шагах composite action,
        # поэтому мы форсируем лимит времени через команду coreutils timeout.
        TIMEOUT_SECONDS=$((TIMEOUT_MINUTES * 60))
        timeout "${TIMEOUT_SECONDS}" \
          uv run --no-project --with openhands-sdk --with openhands-tools --with 'lmnr<0.7.53' \
            python ../extensions/plugins/qa-changes/scripts/agent_script.py

    - name: Загрузка логов как артефакта
      uses: actions/upload-artifact@v4
      if: always() && steps.preflight.outputs.skip != 'true'
      with:
          name: openhands-qa-changes-logs
          path: |
            *.log
            output/
          retention-days: 7

    - name: Загрузка информации о трейсе Laminar для оценки
      uses: actions/upload-artifact@v4
      if: success() && steps.preflight.outputs.skip != 'true'
      with:
          name: qa-changes-trace-${{ github.event.pull_request.number }}
          path: pr-repo/laminar_trace_info.json
          retention-days: 30
          if-no-files-found: ignore
