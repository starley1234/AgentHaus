---
name: QA изменений от OpenHands

on:
    # Используйте pull_request (не pull_request_target), чтобы workflow работал в
    # контексте head PR — это избегает выполнения недоверенного кода форка с
    # секретами базового репозитория. Компромисс в том, что PR из форков не получат
    # доступ к секретам репозитория; мейнтейнеры могут запускать QA локально или через
    # отдельный доверенный workflow для этих случаев.
    pull_request:
        types: [opened, ready_for_review, labeled, review_requested]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    qa-changes:
        # Запускается когда:
        #   1. Новый не-черновой PR открыт доверенным контрибьютором, ИЛИ
        #   2. Черновой PR переведён в готовый к ревью, ИЛИ
        #   3. Добавлена метка 'qa-this', ИЛИ
        #   4. openhands-agent запрошен как ревьюер
        if: >
            (github.event.action == 'opened'
            && github.event.pull_request.draft == false
            && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR'
            && github.event.pull_request.author_association != 'NONE')
            || (github.event.action == 'ready_for_review'
            && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR'
            && github.event.pull_request.author_association != 'NONE')
            || github.event.label.name == 'qa-this'
            || github.event.requested_reviewer.login == 'openhands-agent'
        concurrency:
            group: qa-changes-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Запуск QA изменений
              uses: OpenHands/extensions/plugins/qa-changes@main
              with:
                  llm-model: anthropic/claude-sonnet-4-5-20250929
                  max-budget: '10.0'
                  timeout-minutes: '30'
                  max-iterations: '500'
                  llm-api-key: ${{ secrets.LLM_API_KEY }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  lmnr-api-key: ${{ secrets.LMNR_SKILLS_API_KEY }}
