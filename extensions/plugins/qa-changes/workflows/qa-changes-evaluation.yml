---
name: Оценка QA изменений

# Этот workflow оценивает, насколько хорошо прошла QA-валидация.
# Запускается при закрытии PR для оценки эффективности QA.
#
# Примечание по безопасности: pull_request_target безопасен здесь, потому что:
# 1. Триггерится только при закрытии PR (не на изменения кода)
# 2. Не чекаутит код PR — только скачивает артефакты из доверенных прогонов workflow
# 3. Запускает скрипты оценки из репозитория extensions, а не из PR

on:
    pull_request_target:
        types: [closed]

permissions:
    contents: read
    pull-requests: read

jobs:
    evaluate:
        runs-on: ubuntu-24.04
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
            REPO_NAME: ${{ github.repository }}
            PR_MERGED: ${{ github.event.pull_request.merged }}

        steps:
            - name: Скачать артефакт трейса QA
              id: download-trace
              uses: dawidd6/action-download-artifact@v19
              continue-on-error: true
              with:
                  workflow: qa-changes-by-openhands.yml
                  name: qa-changes-trace-${{ github.event.pull_request.number }}
                  path: trace-info
                  search_artifacts: true
                  if_no_artifact_found: warn

            - name: Проверить наличие файла трейса
              id: check-trace
              run: |
                  if [ -f "trace-info/laminar_trace_info.json" ]; then
                    echo "trace_exists=true" >> $GITHUB_OUTPUT
                    echo "Найден файл трейса для PR #$PR_NUMBER"
                  else
                    echo "trace_exists=false" >> $GITHUB_OUTPUT
                    echo "Файл трейса не найден для PR #$PR_NUMBER - пропускаем оценку"
                  fi

            # Всегда чекаутим main-ветку для безопасности — нельзя тестировать изменения скриптов в PR
            - name: Checkout репозитория расширений
              if: steps.check-trace.outputs.trace_exists == 'true'
              uses: actions/checkout@v6
              with:
                  repository: OpenHands/extensions
                  path: extensions

            - name: Настройка Python
              if: steps.check-trace.outputs.trace_exists == 'true'
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Установка зависимостей
              if: steps.check-trace.outputs.trace_exists == 'true'
              run: pip install lmnr

            - name: Запуск оценки
              if: steps.check-trace.outputs.trace_exists == 'true'
              env:
                  # Скрипт ожидает LMNR_PROJECT_API_KEY; секрет организации называется LMNR_SKILLS_API_KEY
                  LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_SKILLS_API_KEY }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  python extensions/plugins/qa-changes/scripts/evaluate_qa_changes.py \
                      --trace-file trace-info/laminar_trace_info.json

            - name: Загрузка логов оценки
              uses: actions/upload-artifact@v7
              if: always() && steps.check-trace.outputs.trace_exists == 'true'
              with:
                  name: qa-changes-evaluation-${{ github.event.pull_request.number }}
                  path: '*.log'
                  retention-days: 30
